services:
  oracle-inventario:
    image: gvenzl/oracle-free:latest
    container_name: oracle-inventario
    environment:
      ORACLE_PASSWORD: secret
      APP_USER: inventario_user
      APP_USER_PASSWORD: inventario_pass
    ports:
      - "1524:1521"
    volumes:
      - oracle-inventario-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle-inventario-data: