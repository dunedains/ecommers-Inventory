server.port=8085
spring.application.name=inventario

# Feign clients
feign.client.producto-url=http://localhost:8081

# Oracle DataSource
spring.datasource.url=jdbc:oracle:thin:@localhost:1524/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=inventario_user
spring.datasource.password=inventario_pass

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPA extra
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false